name: Build & Release PC Resource Monitor

on:
  push:
    tags:
      - "pc-resource-monitor-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. pc-resource-monitor-v1.0.0)"
        required: true
        default: "pc-resource-monitor-v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        working-directory: projects/pc-resource-monitor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python launcher.py --make-icon

      - name: Build standalone PCResourceMonitor.exe
        working-directory: projects/pc-resource-monitor
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name PCResourceMonitor `
            --icon hud_icon.ico `
            --add-data "frontend;frontend" `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import pystray._win32 `
            launcher.py

      - name: Build Inno Setup installer
        working-directory: projects/pc-resource-monitor
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: PC Resource Monitor (${{ inputs.tag || github.ref_name }})
          make_latest: false
          files: projects/pc-resource-monitor/dist/PCResourceMonitor-Setup.exe
          body: |
            Standalone Windows 10/11 installer for the **515 × 1920 PC Resource Monitor** floating HUD widget.
            - No Python or external dependencies required
            - Frameless transparent WebView2 widget with System Tray controls
            - Automatic Per-Monitor DPI scaling and portrait monitor detection
