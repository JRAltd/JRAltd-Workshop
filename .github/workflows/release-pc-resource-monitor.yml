name: Build & Release PC Resource Monitor

on:
  push:
    branches:
      - main
    paths:
      - "projects/pc-resource-monitor/**"
    tags:
      - "pc-resource-monitor-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. pc-resource-monitor-v1.0.2)"
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version & tag
        id: meta
        shell: pwsh
        run: |
          $ver = (Get-Content projects/pc-resource-monitor/VERSION -Raw).Trim()
          if ("${{ inputs.tag }}" -ne "") {
            $tag = "${{ inputs.tag }}"
            $ver = $tag -replace '^pc-resource-monitor-v', ''
          } elseif ("${{ github.ref }}" -like "refs/tags/pc-resource-monitor-v*") {
            $tag = "${{ github.ref_name }}"
            $ver = $tag -replace '^pc-resource-monitor-v', ''
          } else {
            $tag = "pc-resource-monitor-v$ver"
          }
          $exists = (git tag -l $tag) | Out-String
          $shouldRelease = [string]::IsNullOrWhiteSpace($exists) -or ("${{ github.ref }}" -like "refs/tags/*") -or ("${{ github.event_name }}" -eq "workflow_dispatch")
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Set up Python 3.12
        if: steps.meta.outputs.should_release == 'True'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        if: steps.meta.outputs.should_release == 'True'
        working-directory: projects/pc-resource-monitor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python launcher.py --make-icon

      - name: Build standalone PCResourceMonitor.exe
        if: steps.meta.outputs.should_release == 'True'
        working-directory: projects/pc-resource-monitor
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name PCResourceMonitor `
            --icon hud_icon.ico `
            --add-data "frontend;frontend" `
            --add-data "VERSION;." `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import pystray._win32 `
            launcher.py

      - name: Build Inno Setup installer
        if: steps.meta.outputs.should_release == 'True'
        working-directory: projects/pc-resource-monitor
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.meta.outputs.version }}" installer.iss

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PC Resource Monitor (${{ steps.meta.outputs.tag }})
          make_latest: false
          files: projects/pc-resource-monitor/dist/PCResourceMonitor-Setup.exe
          body: |
            Standalone Windows 10/11 installer for the **515 × 1920 PC Resource Monitor** floating HUD widget.
            - Automatic silent self-updates via GitHub Releases
            - Frameless transparent WebView2 widget with System Tray controls
            - Automatic Per-Monitor DPI scaling and portrait monitor detection
